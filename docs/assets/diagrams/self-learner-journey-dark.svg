<path d="M 892 262 L 882 267 L 882 257 Z" fill="#8bd5c4" stroke="none"/><rect x="150" y="430" width="900" height="76" rx="16" fill="#423528" stroke="#edc184" stroke-width="1.5" /><text x="600" y="462" class="label" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="600" fill="#edc184" letter-spacing="0" text-anchor="middle">SELF-STUDY • learner-authored • not teacher-validated • not published</text><text x="600" y="490" class="small-ink" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#f2f2e9" letter-spacing="0" text-anchor="middle">The learner reviews the outline; no teacher approval is implied.</text><rect x="70" y="585" width="310" height="240" rx="18" fill="#213e3a" stroke="#8bd5c4" stroke-width="1.5" />
