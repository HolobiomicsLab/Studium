<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 970" width="1200" height="970" role="img" aria-labelledby="self-learner-title self-learner-desc">
  <title id="self-learner-title">Self-learner journey</title>
  <desc id="self-learner-desc">A learner requests a lesson in an AI harness, checks reference licences, extracts passages, lets the agent draft a self-study lesson, reviews the outline, enters play with the authoring notice already visible, and later returns through the FSRS review queue when concepts become due.</desc>
  <rect width="1200" height="970" fill="#13252c"/>
<text x="40" y="58" class="display" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', serif" font-size="46" font-weight="600" fill="#f2f2e9" letter-spacing="-0.035em">Self-learner journey</text><text x="40" y="94" class="small" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#b2c4c7" letter-spacing="0">From chosen references to a transparent, playable self-study lesson</text><rect x="30" y="155" width="270" height="215" rx="18" fill="#1a3038" stroke="#3b535b" stroke-width="1.5" />
<text x="54" y="185" class="eyebrow" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f2f2e9" letter-spacing="0.08em">STEP 1</text>
<text x="54" y="218" class="label" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#f2f2e9" letter-spacing="0">Harness request</text>
<text x="54" y="257" class="body" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#f2f2e9" letter-spacing="0" text-anchor="start">goal + audience</text>
<text x="54" y="286" class="body" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#f2f2e9" letter-spacing="0" text-anchor="start">preferred activity</text><rect x="248" y="171" width="46" height="46" rx="23" fill="#8bd5c4" stroke="#8bd5c4" stroke-width="1.5" />
<text x="271" y="202" class="label" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#13252c" letter-spacing="0" text-anchor="middle">1</text><rect x="320" y="155" width="270" height="215" rx="18" fill="#1a3038" stroke="#3b535b" stroke-width="1.5" />
<text x="344" y="185" class="eyebrow" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f2f2e9" letter-spacing="0.08em">STEP 2</text>
<text x="344" y="218" class="label" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="600" fill="#f2f2e9" letter-spacing="0">References</text>
<text x="344" y="257" class="body" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#f2f2e9" letter-spacing="0" text-anchor="start">choose source</text>
<text x="344" y="286" class="body" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="400" fill="#f2f2e9" letter-spacing="0" text-anchor="start">check licence + reuse</text><rect x="538" y="171" width="46" height="46" rx="23" fill="#8bd5c4" stroke="#8bd5c4" stroke-width="1.5" />
<text x="561" y="202" class="label" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="600" fill="#13252c" letter-spacing="0" text-anchor="middle">2</text><rect x="610" y="155" width="270" height="215" rx="18" fill="#1a3038" stroke="#3b535b" stroke-width="1.5" />
<text x="634" y="185" class="eyebrow" font-family="'Avenir Next', Avenir, 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f2f2e9" letter-spacing="0.08em">STEP 3</text>
