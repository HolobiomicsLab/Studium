[mcp_servers.studium]
command = "node"
args = ["/ABS/PATH/studium/apps/studium-vscode/dist/lesson-mcp.cjs"]
# Codex asks before each tool not marked read-only (a lesson started, an answer, a rating), and `codex exec`
# refuses it ("requires approval, but approval policy is never"). Studium's tools write only Studium's own data.
default_tools_approval_mode = "approve"

[mcp_servers.studium.env]
BUNDLES_ROOT = "/ABS/PATH/studium/fixtures"
LITELLM_BASE_URL = ""
# Learner state (mastery, review schedule) is durable by default in ~/.studium/data (STUDIUM_HOME).
# Set STUDIUM_DATA_DIR to keep it elsewhere, or STUDIUM_EPHEMERAL = "1" to keep it in memory only.
# STUDIUM_DATA_DIR = "/ABS/PATH/studium-data"
