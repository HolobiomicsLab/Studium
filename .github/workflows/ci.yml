name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      # vitest and the spawned lesson-mcp subprocess both resolve @studium/* through
      # package.json "main" -> dist/, which a fresh checkout does not have. Without this,
      # `pnpm test` fails in lesson-session and every downstream job is skipped.
      - name: Build workspace libraries
        run: pnpm build:libs

      - name: Lint
        run: pnpm lint

      - name: TypeScript tests
        run: pnpm test

      - name: Python tests
        run: pytest

  tester-path:
    name: Tester onboarding path
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Run setup.sh (preflight + install + vendor + build)
        run: ./setup.sh

      - name: Studium VS Code driver suite
        run: pnpm --filter studium-vscode test

  # Opt-in only (Actions -> CI -> Run workflow). `student-runtime` is the Tauri desktop app,
  # which TESTING.md §8 and this release's spec both put OUT OF SCOPE: VS Code is the
  # interactive surface we ask colleagues to run. Building it on every push cost ~20 min on
  # Ubuntu (cargo-tarpaulin is rebuilt from source) plus a macOS runner billed at 10x, to
  # guard an app nobody on the tester path launches. The jobs that gate what we ship are
  # `test` (2 min) and `tester-path` (1 min).
  tauri-build:
    name: Tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install webkit dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/student-runtime/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app (debug, no signing)
        run: pnpm --filter @studium/student-runtime tauri:build --debug

      - name: Install cargo-tarpaulin (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install cargo-tarpaulin --locked --version "^0.30"

      - name: Run cargo tarpaulin coverage (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/student-runtime/src-tauri
        run: |
          cargo tarpaulin \
            --packages student-runtime \
            --out Xml \
            --output-dir ../../../target/coverage || \
          cargo tarpaulin --out Xml --output-dir ../../../target/coverage

      - name: Upload coverage report (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-coverage
          path: target/coverage/cobertura.xml
          if-no-files-found: warn

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: |
            apps/student-runtime/src-tauri/target/debug/bundle/
            apps/student-runtime/src-tauri/target/release/bundle/
          if-no-files-found: warn

  # Opt-in only (Actions -> CI -> Run workflow). This job was gated behind a failing lint
  # step since the repo began, so it had never once executed. Its first run (2026-07-10)
  # showed its Python setup has never been valid: it editable-installs `services/planner`,
  # which has no pyproject.toml or setup.py; `scene-synth` and `analytics-collector` still
  # pin requires-python >=3.13 while CI runs 3.12; and analytics-collector depends on
  # `telemetry-events @ file:../../packages/telemetry-events`, a relative path that escapes
  # the repo root from the runner's working directory. Repairing it is tracked separately.
  # Left on push, it would keep the repo permanently red and tell a tester nothing true.
  demo-m6:
    name: Demo M6 end-to-end atomistique
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install -e packages/telemetry-events
          pip install -e services/planner
          pip install -e services/scene-synth
          pip install -e services/analytics-collector

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace libraries
        run: pnpm build:libs

      - name: Install Tauri/webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            xvfb \
            jq

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run e2e-demo-m6 (CI mode)
        run: xvfb-run -a bash tools/e2e-demo-m6.sh --ci
        env:
          STUDIUM_EVIDENCE_ENRICH: "off"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-m6-logs
          path: |
            /tmp/m6-collector.log
            /tmp/m6-dash.log
            /tmp/m6-wdio.log
