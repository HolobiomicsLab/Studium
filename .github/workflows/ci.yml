name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Manuel : `tauri-build` et `demo-m6` (application Tauri gelée, SR-1 / CI-1) ne tournent
  # QUE sur demande. C'est le geste à faire avant une release Tier-A, quand le bundle macOS
  # est ce qu'on veut vraiment voir se construire.
  workflow_dispatch:

permissions:
  contents: read

# Since the production sprint (C6) the lesson-mcp server keeps learner state in ~/.studium/data by default.
# Every test, driver and smoke step here runs in memory instead, so one job's state never leaks into
# another's expectations.
env:
  STUDIUM_EPHEMERAL: "1"

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc, Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        # No `version:` here on purpose. `package.json`'s `packageManager` field pins
        # pnpm for CI and for every contributor at once (INT-STUDIUM-031), and
        # action-setup refuses to run when both are given.
        uses: pnpm/action-setup@v3

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # INT-STUDIUM-011: the pins live in `requirements.txt` and nowhere else. The hand-written
        # list this replaced was missing PyMuPDF, so `services/ingest` could not have run here even
        # once the step below started collecting it.
        run: pip install -r requirements.txt

      - name: Install Node dependencies
        # `--frozen-lockfile`: CI builds exactly what pnpm-lock.yaml records (ENG-04). A manifest
        # edited without `pnpm install` fails here instead of resolving something newer.
        run: pnpm install --frozen-lockfile

      - name: Dependency audit (production, critical)
        # ENG-04. Blocking. `next` 14.2.35 (teacher-dashboard, author-web) is the last 14.x release and
        # three "critical" advisories are only patched from 15.5.28: those three GHSA ids, and only
        # those, are listed in `pnpm.auditConfig.ignoreGhsas` of the root package.json, so any other new
        # critical advisory fails this step. Drop the list when the dashboards move to Next 15 (or are
        # retired).
        run: pnpm audit --prod --audit-level=critical

      - name: Lint
        run: pnpm lint

      - name: Workspace compiles (TypeScript)
        # This step's failure means one thing, and now says it: the workspace does not
        # compile. Until INT-STUDIUM-031 `pnpm build` ran only inside `tauri build`'s
        # beforeBuildCommand, so a TypeScript error surfaced as a red job named
        # "Tauri build" on two platform runners, and read for two days as a desktop
        # toolchain problem. The platform jobs now fail *after* this one rather than
        # instead of it.
        #
        # It also covers what the tests need: @studium/llm-client resolves through
        # ./dist, which is gitignored, so packages/lesson-session cannot import it on a
        # fresh checkout. Measured 2026-09-08 on `dev`: exit 0 over 18 workspaces,
        # teacher-dashboard included, and the tree stays clean (INT-STUDIUM-015).
        run: pnpm build

      - name: TypeScript tests
        run: pnpm test

      - name: Teaching-material lint
        run: node_modules/.pnpm/node_modules/.bin/tsx tools/bundle_lint.mjs

      - name: Headless MCP smoke (harness-agnostic lesson drive)
        run: node apps/lesson-mcp/scripts/headless_smoke.mjs

      - name: Python tests
        # A bare `pytest` is limited by `pytest.ini` (`testpaths = packages`) to 112 tests, so ~1000
        # tests under services/, eval/, tools/ and fixtures/ were green only when someone ran them
        # by hand. This is the command CLAUDE.md declares (INT-STUDIUM-011).
        run: python tools/pytest_all.py

      - name: ASTRA validator (INT-STUDIUM-010)
        run: |
          python tools/astra_validate_check.py
          python -m pytest services/planner/tests/test_provenance_astra_validate_cli.py -q

      # Since INT-STUDIUM-011 the step above also runs this test, inside the services/planner
      # suite. It stays named here as a loud gate: when the LWG build breaks, the job that goes red
      # says so, instead of pointing at a suite of 233 tests.
      - name: Planner LWG build outside pytest (INT-STUDIUM-016)
        run: python -m pytest services/planner/tests/test_plan_lwg_subprocess.py -q

      - name: Observatory tests (INT-STUDIUM-008)
        run: |
          python -m pytest services/observatory \
            services/planner/tests/test_provenance_astra_read.py \
            services/planner/tests/test_provenance_astra_validate_timeout.py \
            eval/tests/test_runner_max_turns_constant.py -q

  tester-path:
    name: Tester onboarding path
    runs-on: ubuntu-latest
    needs: test

    # What a colleague actually runs from a fresh clone. `setup.sh` is the single
    # documented command in TESTING.md and in the French guide, and until now nothing
    # executed it — the same shape as every other defect found this week: the path we
    # ask someone else to walk was the one path CI never walked. ~1 min.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Run setup.sh (preflight + install + vendor + build)
        run: ./setup.sh

      - name: Studium VS Code driver suite
        run: pnpm --filter studium-vscode test

  vsix:
    name: VSIX + standalone MCP server
    runs-on: ubuntu-latest
    needs: test

    # ENG-06 / ENG-07 : the VSIX used to be built by hand, on one machine, with `vendor` optional.
    # This job builds it the way a release does, refuses a package that lacks the dist bundle, the
    # vendored viewers or the nls manifests, and uploads both the VSIX and the self-contained
    # `lesson-mcp.cjs` (the same file the VSIX embeds) as a workflow artifact.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc, Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        # `@studium/llm-client` and friends resolve through ./dist, which a fresh checkout lacks.
        run: pnpm build:libs

      - name: Vendor the pane's viewer libraries
        run: pnpm --filter studium-vscode vendor

      - name: Package the VSIX
        run: pnpm --filter studium-vscode package

      - name: Check the VSIX contents
        run: .github/scripts/check-vsix.sh apps/studium-vscode/*.vsix

      - name: Smoke-test the standalone MCP server
        # Initialise over stdio and check the server answers with its name: the bundle starts
        # without the repository next to it. The reply is captured, not piped into `grep -q`, so a
        # closed pipe cannot turn a pass into a SIGPIPE failure under `pipefail`.
        run: |
          reply="$(printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | BUNDLES_ROOT="$RUNNER_TEMP" timeout 20 node apps/studium-vscode/dist/lesson-mcp.cjs 2>/dev/null || true)"
          echo "$reply"
          grep -q '"studium-lesson"' <<<"$reply"

      - name: Upload VSIX and MCP bundle
        uses: actions/upload-artifact@v4
        with:
          name: studium-vsix
          path: |
            apps/studium-vscode/*.vsix
            apps/studium-vscode/dist/lesson-mcp.cjs
          if-no-files-found: error

  # SR-1 / CI-1 : l'application Tauri (apps/student-runtime) est GELÉE (voir son README). Elle ne
  # reconstruit plus à chaque push : `tauri-build` et `demo-m6` sont lancés à la main (Actions >
  # CI > Run workflow). Les suites de lesson-server et du collecteur, elles, restent dans
  # « Lint + Test » (`pnpm test` et `tools/pytest_all.py`), donc sur chaque push.
  tauri-build:
    name: Tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        # Dispatch manuel seulement (SR-1 / CI-1) : les deux jambes. macOS est facturé 10x la minute
        # Linux ; on le paie quand le bundle macOS est l'objet de l'exercice, pas à chaque push.
        # Tauri casse par plateforme, d'où les deux systèmes plutôt qu'un seul.
        os: ["macos-latest", "ubuntu-22.04"]

    steps:
      - uses: actions/checkout@v4

      - name: Install webkit dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Setup Node (from .nvmrc, Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/student-runtime/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (debug, no signing)
        run: pnpm --filter @studium/student-runtime tauri:build --debug

      - name: Install cargo-tarpaulin (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install cargo-tarpaulin --locked --version "^0.30"

      - name: Run cargo tarpaulin coverage (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/student-runtime/src-tauri
        run: |
          cargo tarpaulin \
            --packages student-runtime \
            --out Xml \
            --output-dir ../../../target/coverage || \
          cargo tarpaulin --out Xml --output-dir ../../../target/coverage

      - name: Upload coverage report (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-coverage
          path: target/coverage/cobertura.xml
          if-no-files-found: warn

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: |
            apps/student-runtime/src-tauri/target/debug/bundle/
            apps/student-runtime/src-tauri/target/release/bundle/
          if-no-files-found: warn

  demo-m6:
    name: Demo M6 end-to-end atomistique
    needs: tauri-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (from .nvmrc, Node 22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v3

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install -e packages/telemetry-events
          pip install -e services/planner
          pip install -e services/scene-synth
          pip install -e services/analytics-collector

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Tauri/webkit deps
        # `webkit2gtk-driver` fournit /usr/bin/WebKitWebDriver, que `tauri-driver`
        # lance en sous-processus. Sans lui, tauri-driver meurt immédiatement
        # (`CannotFindBinaryPath`) et WDIO échoue en ECONNREFUSED sur le port 4444 —
        # une erreur qui désigne le port, pas la cause. `libwebkit2gtk-4.1-dev` ne
        # suffit pas : ce sont les en-têtes de compilation, pas le pilote.
        # (INT-STUDIUM-033)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            xvfb \
            jq

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # Avant la démo, pas après : le smoke test exerce le bloc d'assertions de
      # l'étape 6 sous un `curl` bouchonné et coûte quelques secondes, là où la
      # démo coûte un build Tauri. Rien ne le lançait, ce qui est comment trois
      # défauts de ce bloc ont survécu (INT-STUDIUM-021).
      - name: e2e-demo-m6 smoke tests (INT-STUDIUM-021)
        run: bash tools/e2e-demo-m6.test.sh

      - name: Run e2e-demo-m6 (CI mode)
        run: xvfb-run -a bash tools/e2e-demo-m6.sh --ci
        env:
          STUDIUM_EVIDENCE_ENRICH: "off"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-m6-logs
          path: |
            /tmp/m6-collector.log
            /tmp/m6-dash.log
            /tmp/m6-wdio.log
