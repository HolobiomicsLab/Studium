name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: "9"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pydantic pytest fastapi httpx

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: TypeScript tests
        run: pnpm test

      - name: Teaching-material lint
        run: node_modules/.pnpm/node_modules/.bin/tsx tools/bundle_lint.mjs

      - name: Headless MCP smoke (harness-agnostic lesson drive)
        run: node apps/lesson-mcp/scripts/headless_smoke.mjs

      - name: Python tests
        run: pytest

  tauri-build:
    name: Tauri build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: "!contains(github.event.head_commit.message, '[skip tauri]')"

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install webkit dependencies (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: "9"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/student-runtime/src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri app (debug, no signing)
        run: pnpm --filter @studium/student-runtime tauri:build --debug

      - name: Install cargo-tarpaulin (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        run: cargo install cargo-tarpaulin --locked --version "^0.30"

      - name: Run cargo tarpaulin coverage (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        working-directory: apps/student-runtime/src-tauri
        run: |
          cargo tarpaulin \
            --packages student-runtime \
            --out Xml \
            --output-dir ../../../target/coverage || \
          cargo tarpaulin --out Xml --output-dir ../../../target/coverage

      - name: Upload coverage report (Linux only)
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: tarpaulin-coverage
          path: target/coverage/cobertura.xml
          if-no-files-found: warn

      - name: Upload Tauri bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: tauri-bundle-${{ matrix.os }}
          path: |
            apps/student-runtime/src-tauri/target/debug/bundle/
            apps/student-runtime/src-tauri/target/release/bundle/
          if-no-files-found: warn

  demo-m6:
    name: Demo M6 end-to-end atomistique
    needs: tauri-build
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: "9"

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          pip install -e packages/telemetry-events
          pip install -e services/planner
          pip install -e services/scene-synth
          pip install -e services/analytics-collector

      - name: Install Node dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Tauri/webkit deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            xvfb \
            jq

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Run e2e-demo-m6 (CI mode)
        run: xvfb-run -a bash tools/e2e-demo-m6.sh --ci
        env:
          STUDIUM_EVIDENCE_ENRICH: "off"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-m6-logs
          path: |
            /tmp/m6-collector.log
            /tmp/m6-dash.log
            /tmp/m6-wdio.log
