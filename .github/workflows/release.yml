name: Release

# ENG-06 / ENG-07. Pushing a tag `vX.Y.Z` builds the VSIX and the self-contained MCP server, attaches
# both to a GitHub Release (draft: the owner publishes it), and publishes to each registry whose token
# is configured as a repository secret. A publish step is skipped when its secret is absent, so a tag
# never fails for want of a token:
#
#   VSCE_PAT   Visual Studio Marketplace, publisher "holobiomicslab" (vsce)
#   OVSX_PAT   Open VSX Registry, namespace "holobiomicslab" (ovsx)
#   NPM_TOKEN  npm, package "studium-mcp": the bundled MCP server, no runtime dependency
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must equal the version in apps/studium-vscode/package.json, so a release cannot carry a
# VSIX that calls itself another version.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the release and upload assets
  id-token: write # npm provenance attestation

jobs:
  release:
    name: Build and attach VSIX + lesson-mcp.cjs
    runs-on: ubuntu-latest
    # Job-level so that each registry step's `if:` can see whether its token exists.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node (from .nvmrc, Node 22 LTS)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Tag matches the extension version
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(node -p "require('./apps/studium-vscode/package.json').version")"
          if [ "$want" != "$have" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match apps/studium-vscode/package.json version ${have}" >&2
            exit 1
          fi

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm build:libs

      # The extension's drivers read the panel renderer from apps/lesson-panel-ui/dist, which
      # build:libs (packages only) does not produce. Without it a fresh runner fails at
      # context-help.driver.ts.
      - name: Build the lesson panel renderer
        run: pnpm --filter @studium/lesson-panel-ui build

      - name: Test the extension and the MCP server
        run: |
          pnpm --filter studium-vscode test
          pnpm --filter @studium/lesson-mcp test

      - name: Vendor the pane's viewer libraries
        run: pnpm --filter studium-vscode vendor

      - name: Package the VSIX
        run: pnpm --filter studium-vscode package

      - name: Check the VSIX contents
        run: .github/scripts/check-vsix.sh apps/studium-vscode/*.vsix

      - name: Stage release assets
        run: |
          mkdir -p release
          cp apps/studium-vscode/*.vsix "release/studium-${GITHUB_REF_NAME}.vsix"
          cp apps/studium-vscode/dist/lesson-mcp.cjs release/lesson-mcp.cjs
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Stage the npm package studium-mcp (bundled server, no dependencies)
        run: node .github/scripts/stage-npm-mcp.mjs "${GITHUB_REF_NAME#v}" npm-stage

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --draft --generate-notes --title "Studium ${GITHUB_REF_NAME}"

      # Registry steps: each runs only when its token secret exists (see the header).
      - name: Visual Studio Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: pnpm --filter studium-vscode exec vsce publish --packagePath "$GITHUB_WORKSPACE/release/studium-${GITHUB_REF_NAME}.vsix"

      - name: Open VSX Registry
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.2.0 publish "release/studium-${GITHUB_REF_NAME}.vsix" -p "$OVSX_PAT"

      - name: npm (studium-mcp)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          (cd npm-stage && npm publish --access public --provenance)
