name: Release

# ENG-06 / ENG-07. Pushing a tag `vX.Y.Z` builds the VSIX and the self-contained MCP server
# (tools/release/build.sh, the same script a maintainer runs on a laptop), attaches both to a GitHub
# Release (draft: the owner publishes it), and sends them to each registry that is switched on.
#
# No long-lived token for npm, the Marketplace or the MCP Registry: the job proves who it is with
# GitHub's OIDC token, and each registry was told once to trust this repository and this workflow file
# (docs/develop/release.md, "Set up the automation once"). A registry is switched on by a repository
# variable, since there is no secret whose presence could be tested:
#
#   vars.PUBLISH_NPM = true            npm, package "studium-mcp" (trusted publisher)
#   vars.PUBLISH_MARKETPLACE = true    Visual Studio Marketplace, publisher "holobiomicslab" (trusted publishing)
#   vars.PUBLISH_MCP_REGISTRY = true   MCP Registry, "io.github.HolobiomicsLab/studium" (github-oidc)
#   vars.PUBLISH_OPEN_VSX = true       Open VSX Registry, namespace "holobiomicslab", with secrets.OVSX_PAT:
#                                      a token, Open VSX has no OIDC route. Only its own step sees it.
#
# A step whose switch is off is skipped, so a tag never fails for want of a registry. A step whose
# registry already has the version is skipped too (tools/release/registries.mjs), so a failed run can
# be started again: a registry refuses a version it already has.
#
# Do not rename this file without updating the three registries: they trust "release.yml" by name.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # create the draft release and upload its files
  id-token: write # the OIDC token that npm, the Marketplace and the MCP Registry exchange

jobs:
  release:
    name: Build, draft release, registries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node (from .nvmrc, Node 22 LTS)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # One version in every place, the tag equal to it, the tests of the extension and of the MCP
      # server, the VSIX and its contents check, the checksums and the npm package.
      - name: Build the release files
        run: |
          tools/release/build.sh release --tag "$GITHUB_REF_NAME"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already; its files are left as they are."
          else
            gh release create "$GITHUB_REF_NAME" "release/studium-${GITHUB_REF_NAME}.vsix" release/lesson-mcp.cjs release/SHA256SUMS.txt \
              --draft --generate-notes --title "Studium ${GITHUB_REF_NAME}"
          fi

      # npm trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10. No token: npm exchanges
      # the job's OIDC token. A provenance attestation is added when the repository is public.
      - name: npm (studium-mcp)
        if: ${{ vars.PUBLISH_NPM == 'true' }}
        run: |
          npm install --global npm@11
          cd release/npm-stage
          node "$GITHUB_WORKSPACE/tools/release/registries.mjs" unless npm "$VERSION" -- npm publish --access public

      - name: Open VSX Registry
        if: ${{ vars.PUBLISH_OPEN_VSX == 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: node tools/release/registries.mjs unless open-vsx "$VERSION" -- npx --yes ovsx@1.2.0 publish "release/studium-${GITHUB_REF_NAME}.vsix"

      - name: Visual Studio Marketplace
        if: ${{ vars.PUBLISH_MARKETPLACE == 'true' }}
        run: |
          node tools/release/registries.mjs unless marketplace "$VERSION" -- \
            pnpm --filter studium-vscode exec vsce publish --oidc --packagePath "$GITHUB_WORKSPACE/release/studium-${GITHUB_REF_NAME}.vsix"

      # Last: the registry checks that the npm package of this version exists and claims the server's
      # name (`mcpName`). It reads server.json at the root of the checkout.
      - name: MCP Registry
        if: ${{ vars.PUBLISH_MCP_REGISTRY == 'true' }}
        run: |
          node tools/release/registries.mjs wait npm "$VERSION" --minutes 10
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          node tools/release/registries.mjs unless mcp-registry "$VERSION" -- \
            sh -c './mcp-publisher login github-oidc && ./mcp-publisher publish'
