name: Problem or difficulty
description: Something in Studium failed, contradicted its documentation or was hard to use
title: "[problem] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Répondez en français ou en anglais.
        Only the first two fields are required. Leave out learner answers, names, answer keys of a
        teacher's lesson, tokens and data folders: see
        [Report a problem or contribute](https://github.com/HolobiomicsLab/studium/blob/main/docs/start/report-and-contribute.md).
        A vulnerability goes to the [security policy](https://github.com/HolobiomicsLab/studium/security/policy), not here.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What were you doing, and what did you see? Paste the exact message, shortened if long.
      placeholder: |
        As a learner in Claude Code, I asked for my reviews. start_review_session answered nothing_due,
        although get_study_plan listed one review due today.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Smallest way to see it again
      description: The request to the assistant, the tool call with its arguments, the command, or the page and the step. A demo lesson under `fixtures/` is the best example.

  - type: dropdown
    id: role
    attributes:
      label: Your role
      options:
        - Learner
        - Teacher
        - Developer or operator
        - Other

  - type: dropdown
    id: area
    attributes:
      label: Where
      multiple: true
      options:
        - Lesson in a conversation (MCP server)
        - VS Code extension or lesson panel
        - Authoring a lesson
        - Review and approval
        - Teacher dashboard or class report
        - Command-line tools
        - Documentation
        - Skills
        - Installation

  - type: input
    id: version
    attributes:
      label: Version
      description: "`version` and `build` from `get_server_info`, or the extension's version in VS Code, or the commit."
      placeholder: "0.4.0, bundled 2026-11-10"

  - type: input
    id: environment
    attributes:
      label: Assistant and platform
      placeholder: "Claude Code / macOS 15 / Node 22"

  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This report holds no learner answer, no name, no answer key of a teacher's lesson and no secret.
          required: true
