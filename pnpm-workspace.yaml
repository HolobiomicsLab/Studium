packages:
  - "packages/*"
  - "apps/*"
# pnpm 11 aborts `pnpm --filter <pkg> <script>` with ERR_PNPM_IGNORED_BUILDS
# (edgedriver/geckodriver build scripts intentionally unapproved). Disable the
# pre-run deps check so filtered scripts run directly (tech-debt #1).
verifyDepsBeforeRun: false
onlyBuiltDependencies:
  - esbuild
ignoredBuiltDependencies:
  - edgedriver
  - geckodriver
allowBuilds:
  edgedriver: set this to true or false
  esbuild: set this to true or false
  geckodriver: set this to true or false
