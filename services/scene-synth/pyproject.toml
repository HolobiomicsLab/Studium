[project]
name = "scene-synth"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "litellm>=1.40",
  "jinja2>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["scene_synth_app", "scene_synth_schemas", "abs_loader", "bundler", "orchestrator", "prov", "learner_items_store", "learner_review"]

[tool.setuptools.packages.find]
include = ["agents*"]
