[project]
name = "telemetry-events"
version = "0.5.0"
# The repo's declared Python floor is 3.12 (CI, README, CLAUDE.md). The module imports only
# `typing` and `pydantic`, so the previous >=3.13 pin was an over-restriction that made this
# package uninstallable on CI's 3.12 and broke `pytest` collection.
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["telemetry_events"]

[tool.setuptools.package-dir]
telemetry_events = "src"
